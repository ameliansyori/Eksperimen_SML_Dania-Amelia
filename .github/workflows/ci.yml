name: Data Preprocessing Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-preprocessing-automation:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository lo
    - name: Run actions/checkout@v4
      uses: actions/checkout@v4

    # 2. Set up Python 3.12.7
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.7"

    # 3. Install library yang dibutuhin script automation lo
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn

    # 4. 🔥 JALANKAN SCRIPT AUTOMATION (Sesuai Kriteria 1!)
    - name: Run Preprocessing Script
      run: |
        echo "Menjalankan otomatisasi preprocessing..."
        python automate_Dania-Amelia.py

    # 5. Upload file dataset_preprocessing.csv sebagai bukti ke GitHub Artifact
    - name: Upload Clean Dataset Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hasil-preprocessing-clean
        path: preprocessing/dataset_preprocessing.csv
